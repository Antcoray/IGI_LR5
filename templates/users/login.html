{% extends 'base.html' %}{% block title %}Вход — АвтоПремиум{% endblock %}{% block content %}
<section class="card" style="max-width:420px;margin:0 auto;">
  <h1>Вход</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <label class="field"><span class="field-label">{{ field.label }}</span>
      {{ field }}
      {% for e in field.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}
    </label>
    {% endfor %}
    {% if form.non_field_errors %}<p class="alert alert-danger">{{ form.non_field_errors }}</p>{% endif %}
    <button type="submit" class="btn btn-gold" style="width:100%;">Войти</button>
  </form>
  <hr>
  <p class="text-center muted">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>{% endblock %}
