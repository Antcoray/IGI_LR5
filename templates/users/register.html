{% extends 'base.html' %}
{% block title %}Регистрация — АвтоПремиум{% endblock %}
{% block content %}
<section class="card" style="max-width:760px;margin:0 auto;">
  <h1>Регистрация</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <fieldset class="field-row">
      <legend>Учётные данные</legend>
      <label class="field"><span class="field-label">{{ form.username.label }}</span>{{ form.username }}{% for e in form.username.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">{{ form.email.label }}</span>{{ form.email }}{% for e in form.email.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">{{ form.password1.label }}</span>{{ form.password1 }}{% for e in form.password1.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">{{ form.password2.label }}</span>{{ form.password2 }}{% for e in form.password2.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
    </fieldset>
    <fieldset class="field-row">
      <legend>ФИО</legend>
      <label class="field"><span class="field-label">{{ form.last_name.label }}</span>{{ form.last_name }}</label>
      <label class="field"><span class="field-label">{{ form.first_name.label }}</span>{{ form.first_name }}</label>
      <label class="field"><span class="field-label">{{ form.patronymic.label }}</span>{{ form.patronymic }}</label>
    </fieldset>
    <fieldset class="field-row">
      <legend>Контакты и адрес</legend>
      <label class="field"><span class="field-label">{{ form.phone.label }}</span>{{ form.phone }}{% for e in form.phone.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">{{ form.birth_date.label }}</span>{{ form.birth_date }}{% for e in form.birth_date.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">{{ form.city.label }}</span>{{ form.city }}</label>
      <label class="field"><span class="field-label">{{ form.address.label }}</span>{{ form.address }}</label>
    </fieldset>
    <fieldset class="field-row">
      <legend>Паспортные данные</legend>
      <label class="field"><span class="field-label">{{ form.passport_series.label }}</span>{{ form.passport_series }}</label>
      <label class="field"><span class="field-label">{{ form.passport_number.label }}</span>{{ form.passport_number }}</label>
    </fieldset>
    <button type="submit" class="btn btn-gold" style="width:100%;">Зарегистрироваться</button>
  </form>
  <hr>
  <p class="text-center muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
