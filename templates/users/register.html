{% extends 'base.html' %}{% block title %}Регистрация — АвтоПремиум{% endblock %}{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header text-gold"><i class="bi bi-person-plus me-2"></i>Регистрация</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-gold w-100">Зарегистрироваться</button>
        </form>
        <hr>
        <p class="text-center text-muted small">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
      </div>
    </div>
  </div>
</div>{% endblock %}
