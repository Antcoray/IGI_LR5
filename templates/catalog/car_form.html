{% extends 'base.html' %}
{% block title %}{{ title }} — АвтоПремиум{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <label class="field"><span class="field-label">{{ field.label }}</span>
      {{ field }}
      {% for e in field.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}
    </label>
    {% endfor %}
    <menu class="flex">
      <li><button type="submit" class="btn btn-gold">Сохранить</button></li>
      {% if car %}
      <li><a href="{% url 'car_detail' car.pk %}" class="btn">Отмена</a></li>
      {% else %}
      <li><a href="{% url 'car_list' %}" class="btn">Отмена</a></li>
      {% endif %}
    </menu>
  </form>
</section>
{% endblock %}
