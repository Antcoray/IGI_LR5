{% extends 'base.html' %}
{% block title %}{{ title }} — АвтоПремиум{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <fieldset class="field-row">
      <legend>ФИО</legend>
      <label class="field"><span class="field-label">Фамилия</span>{{ form.last_name }}{% for e in form.last_name.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">Имя</span>{{ form.first_name }}{% for e in form.first_name.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">Отчество</span>{{ form.patronymic }}</label>
    </fieldset>
    <fieldset class="field-row">
      <legend>Контакты и адрес</legend>
      <label class="field"><span class="field-label">Телефон (+375 (XX) XXX-XX-XX)</span>{{ form.phone }}{% for e in form.phone.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">Email</span>{{ form.email }}{% for e in form.email.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">Адрес</span>{{ form.address }}</label>
      <label class="field"><span class="field-label">Город</span>{{ form.city }}</label>
    </fieldset>
    <fieldset class="field-row">
      <legend>Паспортные данные</legend>
      <label class="field"><span class="field-label">Дата рождения (18+)</span>{{ form.birth_date }}{% for e in form.birth_date.errors %}<span class="errorlist">{{ e }}</span>{% endfor %}</label>
      <label class="field"><span class="field-label">Серия паспорта</span>{{ form.passport_series }}</label>
      <label class="field"><span class="field-label">Номер паспорта</span>{{ form.passport_number }}</label>
    </fieldset>
    <menu class="flex">
      <li><button type="submit" class="btn btn-gold">Сохранить</button></li>
      <li><a href="{% url 'client_list' %}" class="btn">Отмена</a></li>
    </menu>
  </form>
</section>
{% endblock %}
