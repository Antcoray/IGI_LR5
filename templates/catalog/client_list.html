{% extends 'base.html' %}
{% block title %}Клиенты — АвтоПремиум{% endblock %}
{% block content %}
<header class="flex-between mb-2">
  <h1>Клиенты</h1>
  <a href="{% url 'client_create' %}" class="btn btn-gold">Добавить клиента</a>
</header>

<form method="get" role="search" class="card mb-2 field-row">
  <label class="field"><span class="field-label">Поиск</span>
    <input type="search" name="q" value="{{ q }}" class="input" placeholder="Поиск по ФИО, телефону, email…">
  </label>
  <label class="field"><span class="field-label">Город</span>
    <select name="city">
      <option value="">Все города</option>
      {% for c in cities %}<option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <span class="basis-full">
    <button type="submit" class="btn btn-gold">Найти</button>
    <a href="{% url 'client_list' %}" class="btn">Сброс</a>
  </span>
</form>

<figure class="table-wrap">
  <table>
    <thead>
      <tr><th scope="col">ФИО</th><th scope="col">Телефон</th><th scope="col">Email</th><th scope="col">Город</th><th scope="col">Адрес</th><th scope="col">Зарег.</th><th scope="col"></th></tr>
    </thead>
    <tbody>
      {% for c in clients %}
      <tr>
        <td><a href="{% url 'client_detail' c.pk %}">{{ c.full_name }}</a></td>
        <td>{{ c.phone }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.city|default:"—" }}</td>
        <td class="muted">{{ c.address|default:"—" }}</td>
        <td>{{ c.created_at|date:"d.m.Y" }}</td>
        <td><a href="{% url 'client_update' c.pk %}" class="btn btn-sm">Изм.</a></td>
      </tr>
      {% empty %}
      <tr><td colspan="7" class="text-center muted">Клиентов не найдено</td></tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
<p class="muted">Всего: <strong>{{ clients|length }}</strong></p>
{% endblock %}
