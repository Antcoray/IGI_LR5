version: '3.9'

services:
  web:
    build: .
    container_name: carshop_web

    command: >
      sh -c "
      sleep 5 &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn carshop.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: carshop_db

    restart: always

    environment:
      POSTGRES_DB: carshop
      POSTGRES_USER: carshop_user
      POSTGRES_PASSWORD: password

    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    ports:
      - "5432:5432"

volumes:
  postgres_data: