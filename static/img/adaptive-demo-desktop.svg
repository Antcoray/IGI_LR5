<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="desk-title desk-desc">
  <title id="desk-title">Десктопная версия баннера</title>
  <desc id="desk-desc">Витрина из трёх автомобилей — широкое изображение для больших экранов, совершенно другой макет, а не просто увеличенная мобильная картинка</desc>
  <rect width="1200" height="300" fill="#4a6b8a"/>
  <g transform="translate(120,140)">
    <rect x="0" y="40" width="180" height="60" rx="12" fill="#ffffff"/>
    <rect x="25" y="10" width="130" height="45" rx="10" fill="#ffffff"/>
    <circle cx="35" cy="105" r="20" fill="#212529"/>
    <circle cx="145" cy="105" r="20" fill="#212529"/>
  </g>
  <g transform="translate(510,140)">
    <rect x="0" y="40" width="180" height="60" rx="12" fill="#f4d35e"/>
    <rect x="25" y="10" width="130" height="45" rx="10" fill="#f4d35e"/>
    <circle cx="35" cy="105" r="20" fill="#212529"/>
    <circle cx="145" cy="105" r="20" fill="#212529"/>
  </g>
  <g transform="translate(900,140)">
    <rect x="0" y="40" width="180" height="60" rx="12" fill="#ffffff"/>
    <rect x="25" y="10" width="130" height="45" rx="10" fill="#ffffff"/>
    <circle cx="35" cy="105" r="20" fill="#212529"/>
    <circle cx="145" cy="105" r="20" fill="#212529"/>
  </g>
  <text x="600" y="60" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle">🖥️ Десктопная версия — витрина</text>
  <text x="600" y="270" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">окно ≥ 701px — показаны три автомобиля в ряд</text>
</svg>
